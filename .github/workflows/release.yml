name: Release

on:
  push:
    tags:
      - "v*"
      - "nightly-*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Version or nightly release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - nightly

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.release_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ "$INPUT_TYPE" == "nightly" ]]; then
            tag="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          else
            latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
            latest="${latest:-v0.1.0}"
            tag="$(bun -e '
              const [current, kind] = process.argv.slice(1);
              const parts = current.replace(/^v/, "").split(".").map(Number);
              if (kind === "major") { parts[0] += 1; parts[1] = 0; parts[2] = 0; }
              if (kind === "minor") { parts[1] += 1; parts[2] = 0; }
              if (kind === "patch") parts[2] += 1;
              process.stdout.write(`v${parts.join(".")}`);
            ' "$latest" "$INPUT_TYPE")"
          fi
          if [[ "$tag" == nightly-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set workspace versions
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bunx oxfmt package.json
          bun install --lockfile-only

      - name: Verify tagged stable version was committed
        if: github.event_name == 'push' && steps.release.outputs.prerelease == 'false'
        run: |
          if ! git diff --exit-code -- package.json apps/*/package.json packages/*/package.json bun.lock; then
            echo "Stable tag package versions must be committed before creating the tag." >&2
            exit 1
          fi

      - name: Verify
        run: bun run typecheck && bun test && bun run check

      - name: Build applications
        run: bun run build

      - name: Commit stable version bump
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.prerelease == 'false'
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/*/package.json packages/*/package.json bun.lock
          git commit -m "chore(release): $VERSION"
          git push origin "HEAD:$BRANCH"

      - name: Record release target
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package release archives
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release
          bun scripts/package-release.ts client "$VERSION" "$REPOSITORY" "release/toktracker-client-$VERSION.tgz"
          bun scripts/package-release.ts gateway "$VERSION" "$REPOSITORY" "release/toktracker-gateway-$VERSION.tgz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          args=(--target "${{ steps.target.outputs.sha }}" --title "$TITLE" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/* "${args[@]}"
